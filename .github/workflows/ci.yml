# CONTINUOUS INTEGRATION: every time code is pushed to GitHub, a fresh machine builds the
# project and runs every test. If anything breaks you find out in minutes, not weeks.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    # GitHub starts a real PostgreSQL server next to the tests.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE: postgres
      TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=ci-only-password;Database=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gameservices-api .
